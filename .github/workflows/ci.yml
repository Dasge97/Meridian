name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: meridian_test
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: testing_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://meridian:testing_only@localhost:5432/meridian_test
      TEST_DATABASE_URL: postgresql://meridian:testing_only@localhost:5432/meridian_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build -t meridian:ci .
